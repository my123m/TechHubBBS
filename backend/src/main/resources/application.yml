# ==================== TechHub 应用主配置 ====================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev

  # ==================== 数据源配置 (HikariCP) ====================
  datasource:
    url: jdbc:mysql://localhost:3306/techhub?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # ==================== Jackson 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID                      # 雪花算法主键
      logic-delete-field: deleted             # 逻辑删除字段名
      logic-delete-value: 1                   # 删除时的值
      logic-not-delete-value: 0               # 未删除时的值
  configuration:
    map-underscore-to-camel-case: true        # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印 SQL
  mapper-locations: classpath*:/mapper/**/*.xml

# ==================== JWT 配置 ====================
jwt:
  # 安全说明：jwt.secret 无默认回退值，缺失 JWT_SECRET 环境变量时应用拒绝启动。
  # ponytail: 上限 — 无；升级路径：接入密钥管理服务（Vault/KMS）后改读外部密钥 ID。
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 小时 (毫秒)

# ==================== CORS 配置 ====================
cors:
  allowed-origins: http://localhost:5173

# ==================== AI 服务配置 ====================
ai:
  provider: ${AI_PROVIDER:openai}            # openai / custom
  api-key: ${AI_API_KEY:}
  api-url: ${AI_API_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-3.5-turbo}
  timeout: 10                                # 秒
  max-retries: 2

# ==================== 文件存储配置 (x-file-storage) ====================
dromara:
  x-file-storage:
    default-platform: local
    local-plus:
      - platform: local
        enable-storage: true
        storage-path: /home/Lsk/Documents/Code/Projects/TechHubBBS/backend/uploads/
        domain: http://localhost:8080/file/

# ==================== Knife4j API 文档 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.techhub.controller

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "TechHub BBS API v1.0 | Powered by Spring Boot 3.x"
