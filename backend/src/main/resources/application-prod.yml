# ==================== TechHub 生产环境配置 ====================
# 仅包含与 application.yml 不同的覆写项，Spring Boot 自动合并。
# 激活方式: --spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod

# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== MyBatis-Plus 配置 ====================
# 生产环境关闭 SQL 日志打印
mybatis-plus:
  configuration:
    log-impl:   # 设为空，禁用 SQL 日志输出

# ==================== Knife4j API 文档 ====================
# 生产环境关闭 API 文档
knife4j:
  enable: false

# ==================== CORS 配置 ====================
# 必须通过环境变量 CORS_ORIGINS 传入前端域名（逗号分隔多个）：
#   export CORS_ORIGINS=https://your-domain.com,https://www.your-domain.com
# 缺失 CORS_ORIGINS 时应用拒绝启动（fail-fast），杜绝使用通配符。
cors:
  allowed-origins: ${CORS_ORIGINS}

# ==================== 文件存储配置 ====================
# 生产环境域名需替换为实际域名
dromara:
  x-file-storage:
    local-plus:
      - platform: local
        domain: ${FILE_DOMAIN:https://your-domain.com/file/}
        storage-path: ${UPLOAD_PATH:/app/uploads/}
