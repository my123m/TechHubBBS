# Path-based label rules for actions/labeler
# See https://github.com/actions/labeler

backend:
  - changed-files:
      - any-glob-to-any-file: 'backend/**'

frontend:
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'

docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'

documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'
