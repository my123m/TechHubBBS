name: Issue Automation

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Auto-label issue by content
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const combined = title + ' ' + body;
            const labels = [];

            // Bug
            if (/bug|错误|异常|故障|regression/i.test(combined)) {
              labels.push('bug');
            }

            // Feature / enhancement
            if (/建议|feature|新功能|需求|suggestion|enhancement|request/i.test(combined)) {
              labels.push('enhancement');
            }

            // Security
            if (/安全|security|漏洞|vulnerability/i.test(combined)) {
              labels.push('security');
            }

            // Documentation
            if (/文档|documentation|docs|readme/i.test(combined)) {
              labels.push('documentation');
            }

            // Question
            if (/疑问|问题|how to|求助|help|question/i.test(combined)) {
              labels.push('question');
            }

            // Always add needs-triage for initial review
            labels.push('needs-triage');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels,
            });
