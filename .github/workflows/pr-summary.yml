name: PR Summary

on:
  workflow_run:
    workflows: ['Backend CI', 'Frontend CI']
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Update PR with CI status and comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowName = run.name;
            const conclusion = run.conclusion;
            const headBranch = run.head_branch;
            const htmlUrl = run.html_url;

            // 通过 REST API 获取 workflow run 关联的 PR。
            // workflow_run webhook payload 不含 pull_requests 数组，
            // 且 listPullRequestsAssociatedWithCommit 对 pull_request 事件
            // 产生的 merge commit SHA 无效，必须显式调 getWorkflowRun REST。
            let prNumber = null;
            let headSha = run.head_sha;
            const { data: runDetail } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            if (runDetail.pull_requests && runDetail.pull_requests.length > 0) {
              prNumber = runDetail.pull_requests[0].number;
              if (runDetail.pull_requests[0].head?.sha) {
                headSha = runDetail.pull_requests[0].head.sha;
              }
            }

            if (!prNumber) {
              core.notice('No open PR found for this workflow run.');
              return;
            }

            // Update CI status label
            const statusLabel = conclusion === 'success' ? 'ci-passed' : 'ci-failed';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [statusLabel],
            });

            // Post or update a comment
            const icon = conclusion === 'success' ? '✅' : '❌';
            const body = `${icon} **${workflowName}**: ${conclusion}\n` +
                         `提交: \`${headSha.substring(0, 7)}\` | ` +
                         `[查看运行详情](${htmlUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = `**${workflowName}**:`;
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
