name: PR Summary

on:
  workflow_run:
    workflows: ['Backend CI', 'Frontend CI']
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Update PR with CI status and comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowName = run.name;
            const conclusion = run.conclusion;
            const headBranch = run.head_branch;
            const htmlUrl = run.html_url;

            // Find PR number from workflow_run payload or search by head branch
            let prNumber = null;
            if (run.pull_requests && run.pull_requests.length > 0) {
              prNumber = run.pull_requests[0].number;
            } else {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${headBranch}`,
                state: 'open',
              });
              if (prs.data.length > 0) {
                prNumber = prs.data[0].number;
              }
            }

            if (!prNumber) {
              core.notice('No open PR found for this workflow run.');
              return;
            }

            // Update CI status label
            const statusLabel = conclusion === 'success' ? 'ci-passed' : 'ci-failed';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [statusLabel],
            });

            // Post or update a comment
            const icon = conclusion === 'success' ? '✅' : '❌';
            const body = `${icon} **${workflowName}**: ${conclusion}\n` +
                         `提交: \`${run.head_sha.substring(0, 7)}\` | ` +
                         `[查看运行详情](${htmlUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = `**${workflowName}**:`;
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
