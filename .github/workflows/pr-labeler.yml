name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

      - name: Apply branch-name labels
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labels = [];

            if (/^feature\//.test(branch)) labels.push('feature');
            else if (/^fix\//.test(branch)) labels.push('fix');
            else if (/^refactor\//.test(branch)) labels.push('refactor');
            else if (/^docs?\//.test(branch)) labels.push('docs');
            else if (/^security\//.test(branch)) labels.push('security');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels,
              });
            }
